<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b17" />
    <meta name="description" content="Flip cards, find all six pairs, and test your memory in SurgeAI Memory Match." />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; form-action 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'" />
    <link rel="canonical" href="https://surgeai.si/games/memory-match/" />
    <link rel="stylesheet" href="../../games.css?v=20261110-rewards-2" />
    <title>Memory Match — SurgeAI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090b12; color: #f5f6fb; --muted: #9da5ba; --line: #252a3b; --accent: #9a8cff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: radial-gradient(ellipse at 50% 0, #28204f 0, transparent 55%), #090b12; }
      a { color: inherit; text-decoration: none; }
      header, footer { border-color: #ffffff12; border-style: solid; }
      header { border-width: 0 0 1px; }
      footer { border-width: 1px 0 0; color: var(--muted); font-size: .82rem; }
      .wrap { width: min(800px, calc(100% - 32px)); margin: auto; }
      .nav, .footer { min-height: 68px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .brand { font-weight: 850; letter-spacing: -.06em; }.brand span { color: var(--accent); }
      .back { color: var(--muted); font-size: .88rem; }
      main { align-self: center; width: min(100% - 32px, 480px); margin: 40px auto; text-align: center; }
      .eyebrow { color: #c4bbff; text-transform: uppercase; letter-spacing: .16em; font-weight: 800; font-size: .7rem; }
      h1 { margin: 10px 0; font-size: clamp(2.4rem, 10vw, 4rem); line-height: 1; letter-spacing: -.07em; }
      .intro { color: var(--muted); line-height: 1.6; margin: 0 auto 22px; }
      .panel { padding: clamp(16px, 4vw, 26px); border: 1px solid var(--line); border-radius: 22px; background: #111522dd; }
      .stats { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 16px; color: #d7d0ff; font-weight: 700; font-size: .92rem; }
      .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
      .card { aspect-ratio: 1; border: 1px solid #37334f; border-radius: 14px; background: #181729; color: #d9d3ff; font-size: clamp(1.7rem, 9vw, 2.8rem); cursor: pointer; }
      .card:hover:not(:disabled) { background: #24203c; border-color: var(--accent); }
      .card[aria-pressed="true"], .card.matched { background: #24203c; border-color: var(--accent); }
      .card:disabled { cursor: default; }
      .reset { margin-top: 18px; border: 0; border-radius: 11px; padding: 12px 18px; background: var(--accent); color: #100d20; font-weight: 800; cursor: pointer; }
      .status { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); }
      .reset:focus-visible, .card:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body data-game="memory-match">
    <header><div class="wrap nav"><a class="brand" href="../../?v=20261110-sections-1">SURGE<span>AI</span></a><a class="back" href="../../?v=20261110-sections-1">← All games</a></div></header>
    <main>
      <span class="eyebrow">Solo · Find the pairs</span>
      <h1>Memory Match</h1>
      <p class="intro">Flip two cards at a time. Can you find every matching pair?</p>
      <section class="panel" aria-label="Memory Match game">
        <div class="stats"><span id="moves">Moves: 0</span><span id="pairs">Pairs: 0 / 6</span></div>
        <div class="board" id="board" role="group" aria-label="Memory cards"></div>
        <p class="status" id="status" aria-live="polite">Find your first pair.</p>
        <button class="reset" id="reset" type="button">Shuffle cards</button>
      </section>
    </main>
    <footer><div class="wrap footer"><span>SurgeAI Arcade</span><a class="back" href="../../?v=20261110-sections-1">Back to the catalog</a></div></footer>
    <script src="../../games.js?v=20261110-rewards-2" defer></script>
  </body>
</html>
